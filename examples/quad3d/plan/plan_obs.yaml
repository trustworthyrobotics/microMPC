# Complete defaults. CLI flags override YAML; paths are repository-relative.
# PD fixed-point tolerance measures step-scaled primal and dual iterate changes.
schema_version: 1
runtime:
  model_path: quad3d/models/KO_quad3d.pt
  device: cpu
  precision: 32
  horizon: 75
  max_mpc_steps: 850
  seed: null
  dt: 0.025
objective:
  control_weight: 5.0
  q_state:
  - 0.0
  - 0.0
  - 0.0
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  - 0.001
  q_terminal:
  - 15.0
  - 15.0
  - 15.0
  - 10.0
  - 10.0
  - 10.0
  - 10.0
  - 10.0
  - 10.0
  - 10.0
  - 10.0
  - 10.0
  u_min:
  - 0.0
  - -0.1
  - -0.1
  - -0.1
  u_max:
  - 19.62
  - 0.1
  - 0.1
  - 0.1
  control_reference:
  - 9.81
  - 0.0
  - 0.0
  - 0.0
solver:
  cache_dir: quad3d/plan/cache/plan_obs
  pd_rho: 25.0
  pd_iterations: 150
  pd_mode: converged
  pd_primal_tol: 0.01
  pd_fixed_point_tol: 0.01
  pd_step_safety: 0.99
  pd_extrapolation: 1.0
  warm_start: true
  sqp_iterations: 2
task:
  goal_tol: 0.1
  workspace_lower:
  - 0.0
  - 0.0
  - 0.0
  workspace_upper:
  - 5.0
  - 5.0
  - 5.0
  obstacle_radius: 1.25
  model_error_buffer: 0.15
  obstacle_center:
  - 2.5
  - 2.5
  - 2.5
output:
  plot: true
  animation: false
  save_video: false
  video_path: quad3d/plan/results/plan_obs/trajectory.gif
  no_show: false
  # Reconstruct predicted states only for diagnostic plots/animation.
  reconstruct_state_plan: false
