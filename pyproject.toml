[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micrompc"
version = "0.1.0"
description = "Koopman learning and proximal primal-dual model predictive control"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
license-files = ["LICENSE"]
package-dir = {micrompc = "."}
packages = [
    "micrompc",
    "micrompc.examples",
    "micrompc.examples.quadrotor",
    "micrompc.examples.quadrotor.data",
    "micrompc.examples.quadrotor.eval",
    "micrompc.examples.quadrotor.plan",
    "micrompc.examples.quadrotor.shared",
    "micrompc.examples.quadrotor.train",
    "micrompc.examples.rope_manipulation",
    "micrompc.examples.rope_manipulation.data",
    "micrompc.examples.rope_manipulation.plan",
    "micrompc.examples.rope_manipulation.shared",
    "micrompc.examples.rope_manipulation.train",
    "micrompc.solver",
    "micrompc.trainer",
]
include-package-data = false

[tool.setuptools.package-data]
"micrompc.examples.quadrotor" = ["models/*.pt"]
"micrompc.examples.quadrotor.plan" = ["*.yaml"]
"micrompc.examples.rope_manipulation" = ["models/KO_rope/last.ckpt"]
"micrompc.examples.rope_manipulation.plan" = ["*.yaml"]
"micrompc.examples.rope_manipulation.train" = ["*.yaml"]
"micrompc.examples.rope_manipulation.shared" = ["*.xml", "kuka_iiwa_14/*.xml", "kuka_iiwa_14/LICENSE", "kuka_iiwa_14/README.md", "kuka_iiwa_14/CHANGELOG.md", "kuka_iiwa_14/assets/*.obj"]
